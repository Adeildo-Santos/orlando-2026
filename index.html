<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a14" />
  <title>Orlando 2026 — Roteiro de Viagem</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; width: 100%; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #0a0a14; color: #fff; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
    #root { width: 100%; flex: 1; display: flex; flex-direction: column; }

    .scroll-content { flex: 1; overflow-y: auto; padding: 0 0 120px; max-width: 640px; margin: 0 auto; width: 100%; }
    .scroll-content::-webkit-scrollbar { width: 3px; }
    .scroll-content::-webkit-scrollbar-track { background: transparent; }
    .scroll-content::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.15); border-radius: 99px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes lineGrow { from { height: 0; } to { height: 100%; } }
    @keyframes dotPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); } 50% { box-shadow: 0 0 0 8px rgba(255,215,0,0); } }

    .hero-glow { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, rgba(78,205,196,0.04) 40%, transparent 70%); pointer-events: none; }
    .item-card { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stat-number { font-variant-numeric: tabular-nums; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }

    .timeline-line { position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: linear-gradient(180deg, rgba(255,215,0,0.3), rgba(255,215,0,0.05)); }
    .timeline-dot { width: 12px; height: 12px; border-radius: 50%; background: #FFD700; border: 3px solid #0a0a14; box-shadow: 0 0 0 2px rgba(255,215,0,0.3); flex-shrink: 0; animation: dotPulse 2s ease-in-out infinite; }

    .progress-bar { height: 3px; border-radius: 99px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #FFD700, #FF6B6B); transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const SUPABASE_URL = "https://dvgpvcqibhrkzsinncyf.supabase.co";

const { useState, useEffect, useMemo, useCallback } = React;
const { createRoot } = ReactDOM;

const SUPABASE_KEY = (() => {
  const k = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Z3B2Y3FpYmhya3pzaW5uY3lmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODI1NDk0MywiZXhwIjoyMDkzODMwOTQzfQ.Rkh4KIx96Go_Nfk7YHkacV5nfjKvdDgHsLHwz_iyaPE";
  return k;
})();

const TIPOS = {
  Restaurantes: { icon: "🍽️", color: "#FF6B6B", bg: "rgba(255,107,107,0.12)" },
  Eletronicos:  { icon: "💻", color: "#4ECDC4", bg: "rgba(78,205,196,0.12)" },
  Departamentos:{ icon: "🛍️", color: "#A29BFE", bg: "rgba(162,155,254,0.12)" },
  Praia:        { icon: "🏖️", color: "#FFEAA7", bg: "rgba(255,234,167,0.12)" },
  Outlets:      { icon: "🏪", color: "#FF9FF3", bg: "rgba(255,159,243,0.12)" },
  Hotel:        { icon: "🏨", color: "#FFD700", bg: "rgba(255,215,0,0.12)" },
  Mercado:      { icon: "🛒", color: "#55E6C1", bg: "rgba(85,230,193,0.12)" },
  Parques:      { icon: "🎢", color: "#FF6B6B", bg: "rgba(255,107,107,0.12)" },
};

function fmtData(d) { if (!d) return ""; const [a,m,dd]=d.split("-"); return `${dd}/${m}`; }
function diaSemana(d) { if(!d)return""; return ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(d+"T12:00:00").getDay()]; }
function nomeDia(d) { if(!d)return""; return ["domingo","segunda","terça","quarta","quinta","sexta","sábado"][new Date(d+"T12:00:00").getDay()]; }

function Confete() {
  const cores = ["#FFD700","#FF6B6B","#4ECDC4","#A29BFE","#FF9FF3","#55E6C1","#FFEAA7"];
  return React.createElement("div", { style: { position:"fixed", inset:0, pointerEvents:"none", zIndex:9999, overflow:"hidden" } },
    Array.from({length:40}).map((_,i) =>
      React.createElement("div", {
        key:i,
        style: {
          position:"absolute", left: Math.random()*100+"%", top: -10,
          width: 6+Math.random()*6, height: 6+Math.random()*6,
          background: cores[i%cores.length],
          borderRadius: Math.random()>0.5 ? "50%" : "2px",
          animation: `slideUp ${1.5+Math.random()*2}s ease-in ${Math.random()*0.8}s both`,
          opacity: 0.8+Math.random()*0.2,
          transform: `rotate(${Math.random()*360}deg)`
        }
      })
    )
  );
}

function Card({ children, style, delay=0, ...props }) {
  return React.createElement("div", {
    className: "item-card",
    style: { animationDelay: `${delay}s`, ...style },
    ...props
  }, children);
}

function App() {
  const [registros, setRegistros] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [filtro, setFiltro] = useState("todos");
  const [showConfete, setShowConfete] = useState(false);
  const [erro, setErro] = useState(null);

  useEffect(() => {
    fetch(`${SUPABASE_URL}/rest/v1/trip?select=*&order=data.asc`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    })
    .then(r => { if(!r.ok) throw new Error("Erro ao carregar"); return r.json(); })
    .then(data => { setRegistros(data); setCarregando(false); })
    .catch(e => { setErro(e.message); setCarregando(false); });
  }, []);

  const grouped = useMemo(() => {
    const g = {};
    registros.forEach(r => {
      const chave = r.data || "sem-data";
      if(!g[chave]) g[chave] = [];
      g[chave].push(r);
    });
    return Object.entries(g).sort(([a],[b]) => a.localeCompare(b));
  }, [registros]);

  const tipos = useMemo(() => {
    const s = new Set(registros.map(r => r.tipo));
    return ["todos", ...s].filter(Boolean);
  }, [registros]);

  const filtered = useMemo(() => {
    if(filtro==="todos") return grouped;
    return grouped.map(([d,itens]) => [d, itens.filter(i => i.tipo===filtro)]).filter(([_,itens]) => itens.length>0);
  }, [grouped, filtro]);

  const stats = useMemo(() => {
    const t = registros.length;
    const d = grouped.length;
    const tp = new Set(registros.map(r=>r.tipo)).size;
    const tiposCount = {};
    registros.forEach(r => { tiposCount[r.tipo] = (tiposCount[r.tipo]||0)+1; });
    const topTipo = Object.entries(tiposCount).sort((a,b)=>b[1]-a[1])[0];
    return { total: t, dias: d, tipos: tp, topTipo: topTipo?.[0] };
  }, [registros, grouped]);

  return React.createElement("div", { style: { height:"100dvh", display:"flex", flexDirection:"column", background:"#0a0a14"} },

    showConfete && React.createElement(Confete, null),

    // === HERO ===
    React.createElement("div", { style: { position:"relative", overflow:"hidden", paddingTop:"calc(32px + env(safe-area-inset-top,0px))", paddingBottom:0 } },
      React.createElement("div", { className:"hero-glow" }),
      React.createElement("div", { style: { padding:"0 24px", textAlign:"center", position:"relative", zIndex:1 } },
        React.createElement("div", { style: { fontSize:11, fontWeight:600, letterSpacing:"3px", textTransform:"uppercase", color:"rgba(255,215,0,0.5)", marginBottom:6 } }, "Dezembro 2026"),
        React.createElement("h1", { style: { fontSize:32, fontWeight:900, letterSpacing:"-1px" } },
          "Orlando ", React.createElement("span", { style: { color:"#FFD700" } }, "2026")
        ),
        React.createElement("p", { style: { fontSize:13, color:"rgba(255,255,255,0.35)", fontWeight:400, marginTop:4 } },
          "15 — 22 de dezembro · 8 dias de aventura"
        ),
      ),

      // Stats row
      !carregando && React.createElement("div", {
        style: { display:"flex", gap:0, marginTop:24, padding:"0 16px" }
      },
        [
          { label:"Paradas", value:stats.total, color:"#FFD700" },
          { label:"Dias", value:stats.dias, color:"#4ECDC4" },
          { label:"Categorias", value:stats.tipos, color:"#A29BFE" },
          { label:"Top", value:stats.topTipo||"-", color:"#FF9FF3", small:true },
        ].map((s,i) =>
          React.createElement("div", {
            key:s.label, className:"item-card",
            style: { flex:1, textAlign:"center", padding:"10px 4px", animationDelay:`${i*0.06}s`,
              background:"rgba(255,255,255,0.02)", borderRadius:12, margin:"0 4px",
              border:"1px solid rgba(255,255,255,0.04)"
            }
          },
            React.createElement("div", { style: { fontSize:18, fontWeight:800, color:s.color } }, s.value),
            React.createElement("div", { style: { fontSize:9, fontWeight:600, color:"rgba(255,255,255,0.25)", marginTop:2, textTransform:"uppercase", letterSpacing:"1px" } }, s.label)
          )
        )
      ),

      carregando && React.createElement("div", { style: { display:"flex", gap:8, padding:"0 20px", marginTop:24 } },
        Array.from({length:4}).map((_,i) =>
          React.createElement("div", { key:i, className:"skeleton", style: { flex:1, height:60 } })
        )
      ),
    ),

    // === FILTROS ===
    React.createElement("div", { style: { padding:"16px 20px 12px", flexShrink:0 } },
      React.createElement("div", { style: { display:"flex", gap:6, overflowX:"auto", flexShrink:0, scrollbarWidth:"none" } },
        tipos.map(t =>
          React.createElement("button", {
            key:t, onClick:()=>setFiltro(t),
            style: {
              padding:"6px 14px", borderRadius:99, border:"1px solid", fontSize:11, fontWeight:600,
              whiteSpace:"nowrap", cursor:"pointer", fontFamily:"inherit", outline:"none", flexShrink:0,
              transition:"all 0.25s cubic-bezier(0.16,1,0.3,1)",
              background: filtro===t ? "rgba(255,215,0,0.15)" : "rgba(255,255,255,0.03)",
              borderColor: filtro===t ? "rgba(255,215,0,0.4)" : "rgba(255,255,255,0.06)",
              color: filtro===t ? "#FFD700" : "rgba(255,255,255,0.4)",
              boxShadow: filtro===t ? "0 0 20px rgba(255,215,0,0.05)" : "none"
            }
          }, t==="todos" ? "📍 Todos" : `${TIPOS[t]?.icon||"📍"} ${t}`)
        )
      )
    ),

    // === CONTEÚDO ===
    React.createElement("div", { className:"scroll-content" },

      carregando && Array.from({length:5}).map((_,i) =>
        React.createElement("div", { key:i, style: { padding:"20px 24px" } },
          React.createElement("div", { className:"skeleton", style: { height:20, width:"40%", marginBottom:12 } }),
          React.createElement("div", { className:"skeleton", style: { height:50, marginBottom:8 } }),
          React.createElement("div", { className:"skeleton", style: { height:50, marginBottom:8 } }),
          React.createElement("div", { className:"skeleton", style: { height:50 } }),
        )
      ),

      erro && React.createElement("div", { style: { textAlign:"center", padding:60, color:"rgba(255,255,255,0.3)" } },
        React.createElement("div", { style: { fontSize:32, marginBottom:12 } }, "⚠️"),
        React.createElement("div", { style: { fontSize:13 } }, erro)
      ),

      // Timeline
      !carregando && !erro && filtered.length > 0 &&
        React.createElement("div", { style: { padding:"0 20px" } },
          filtered.map(([data, itens], idx) =>
            React.createElement("div", {
              key:data, className:"item-card",
              style: { animationDelay:`${idx*0.08}s`, position:"relative", paddingLeft:0, marginBottom:4 }
            },
              // Timeline connector
              idx < filtered.length-1 && React.createElement("div", {
                style: { position:"absolute", left:19, top:44, bottom:-4, width:2,
                  background:"linear-gradient(180deg, rgba(255,215,0,0.2), rgba(255,215,0,0.02))" }
              }),

              // Day header
              React.createElement("div", { style: { display:"flex", alignItems:"flex-start", gap:14, padding:"16px 0" } },
                React.createElement("div", { className:"timeline-dot" }),
                React.createElement("div", { style: { flex:1 } },
                  React.createElement("div", { style: { display:"flex", justifyContent:"space-between", alignItems:"baseline" } },
                    React.createElement("div",
                      { style: { fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"2px", color:"rgba(255,215,0,0.45)" } },
                      `${nomeDia(data)}, ${fmtData(data)}`
                    ),
                    React.createElement("div", { style: { fontSize:10, color:"rgba(255,255,255,0.2)", fontWeight:500 } },
                      `${itens.length} ${itens.length===1?"parada":"paradas"}`
                    )
                  ),
                  // Items
                  React.createElement("div", { style: { marginTop:10 } },
                    itens.map((item, i) => {
                      const tipo = TIPOS[item.tipo] || { icon:"📍", color:"rgba(255,255,255,0.3)", bg:"rgba(255,255,255,0.03)" };
                      return React.createElement("div", {
                        key:item.id,
                        className: "item-card",
                        style: {
                          display:"flex", alignItems:"center", gap:12,
                          padding:"10px 14px", marginBottom:6,
                          background: "rgba(255,255,255,0.02)",
                          borderRadius:12,
                          border:"1px solid rgba(255,255,255,0.04)",
                          transition:"all 0.2s",
                          animationDelay:`${idx*0.08 + i*0.04}s`,
                        }
                      },
                        React.createElement("div", {
                          style: {
                            width:36, height:36, borderRadius:10,
                            background: tipo.bg,
                            display:"flex", alignItems:"center", justifyContent:"center",
                            fontSize:16, flexShrink:0
                          }
                        }, tipo.icon),
                        React.createElement("div", { style: { flex:1, minWidth:0 } },
                          React.createElement("div", { style: { fontSize:13, fontWeight:600, lineHeight:1.3 } }, item.objetivo),
                          React.createElement("div", { style: { fontSize:10, color:"rgba(255,255,255,0.25)", fontWeight:500, marginTop:1 } }, item.tipo)
                        ),
                        item.endereco && React.createElement("a", {
                          href:`https://maps.google.com/maps?q=${encodeURIComponent(item.endereco)}`,
                          target:"_blank",
                          style: {
                            width:32, height:32, borderRadius:8,
                            display:"flex", alignItems:"center", justifyContent:"center",
                            background:"rgba(255,255,255,0.03)", textDecoration:"none",
                            fontSize:14, flexShrink:0,
                            transition:"all 0.2s", opacity:0.4
                          },
                          title: item.endereco
                        }, "🗺️")
                      );
                    })
                  )
                )
              )
            )
          )
        ),

      !carregando && !erro && filtered.length===0 &&
        React.createElement("div", { style: { textAlign:"center", padding:60, color:"rgba(255,255,255,0.2)" } },
          React.createElement("div", { style: { fontSize:32, marginBottom:8 } }, "🔍"),
          React.createElement("div", { style: { fontSize:13 } }, "Nenhum local encontrado")
        ),

      // Footer
      !carregando && !erro && React.createElement("div", { style: { textAlign:"center", padding:"32px 20px 40px", color:"rgba(255,255,255,0.12)", fontSize:11, fontWeight:500, letterSpacing:"1px" } },
        "🏰 Orlando 2026 · Feito com ❤️"
      )
    )
  );
}

const root = createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
