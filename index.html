const formatCurrency = (value, currency = "USD") =>
  new Intl.NumberFormat("pt-BR", {
    style: "currency",
    currency,
    maximumFractionDigits: 2
  }).format(Number(value || 0));

const formatShortDate = (value) => {
  if (!value) return "";
  const date = new Date(`${value}T12:00:00`);
  return new Intl.DateTimeFormat("pt-BR", {
    day: "2-digit",
    month: "short"
  }).format(date).replace(".", "");
};

const formatWeekday = (value) => {
  if (!value) return "";
  const date = new Date(`${value}T12:00:00`);
  return new Intl.DateTimeFormat("pt-BR", { weekday: "short" }).format(date).replace(".", "");
};

const formatDateRange = (startDate, endDate) => {
  if (!startDate || !endDate) return "";
  return `${formatShortDate(startDate)} - ${formatShortDate(endDate)}`;
};

const formatDuration = (minutes) => {
  const total = Number(minutes || 0);
  if (!total) return "Tempo livre";
  const hours = Math.floor(total / 60);
  const mins = total % 60;
  if (hours && mins) return `${hours}h ${String(mins).padStart(2, "0")}m`;
  if (hours) return `${hours}h`;
  return `${mins}m`;
};

const activityMeta = (category) => {
  const normalized = String(category || "").toLowerCase().replace(/\s+/g, "_");
  return categoryMeta[normalized] || {

  };
};

const cx = (...parts) => parts.filter(Boolean).join(" ");

async function loadItineraryFromSupabase() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;

  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`
  };

  const tripResp = await fetch(
    `${SUPABASE_URL}/rest/v1/trip?select=*&id=eq.${encodeURIComponent(SUPABASE_TRIP_ID)}&limit=1`,
    { headers }
  );
  if (!tripResp.ok) throw new Error("Não foi possível carregar a viagem.");
  const tripRows = await tripResp.json();
  const trip = tripRows?.[0];
  if (!trip) return null;

  const daysResp = await fetch(
    `${SUPABASE_URL}/rest/v1/days?select=*&trip_id=eq.${encodeURIComponent(trip.id)}&order=day_number.asc`,
    { headers }
  );
  if (!daysResp.ok) throw new Error("Não foi possível carregar os dias.");
  const days = await daysResp.json();

  const activitiesResp = days.length
    ? await fetch(
        `${SUPABASE_URL}/rest/v1/activities?select=*&day_id=in.(${days.map((day) => day.id).join(",")})&order=time.asc`,
        { headers }
      )
    : null;
  const activities = activitiesResp?.ok ? await activitiesResp.json() : [];

  return { trip, days, activities };
}

function App() {
  const [data, setData] = useState(null);
  const [selectedDayId, setSelectedDayId] = useState(null);
  const [viewMode, setViewMode] = useState("timeline");
  const [loading, setLoading] = useState(true);
  const [loadSource, setLoadSource] = useState("loading");
  const [toast, setToast] = useState(null);

  useEffect(() => {
    let mounted = true;

    async function boot() {
      setLoading(true);
      setLoadSource("loading");
      try {
        const remote = await loadItineraryFromSupabase();
        if (!mounted) return;
        setData(remote || demoData);
        setLoadSource(remote ? "remote" : "demo");
      } catch {
        if (!mounted) return;
        setData(demoData);
        setLoadSource("error");
      } finally {
        if (mounted) setLoading(false);
      }
    }

    boot();

    return () => {
      mounted = false;
    };
  }, []);

  useEffect(() => {
    if (!data?.days?.length) return;
    if (selectedDayId && data.days.some((day) => day.id === selectedDayId)) return;
    const todayKey = new Date().toISOString().slice(0, 10);
    const todayMatch = data.days.find((day) => day.date === todayKey);
    setSelectedDayId(todayMatch?.id || data.days[0].id);
  }, [data, selectedDayId]);

  const trip = { ...demoData.trip, ...(data?.trip || {}) };
  const days = data?.days || [];
  const activities = data?.activities || [];

  const selectedDay = useMemo(() => days.find((day) => day.id === selectedDayId) || days[0], [days, selectedDayId]);
  const selectedDayActivities = useMemo(
    () => activities.filter((activity) => activity.day_id === selectedDay?.id).sort((a, b) => String(a.time || "").localeCompare(String(b.time || ""))),
    [activities, selectedDay]
  );

  const totals = useMemo(() => {
    const dayCount = days.length;
    const activityCount = selectedDayActivities.length;
    const completedCount = selectedDayActivities.filter((activity) => activity.is_completed).length;
    const plannedBudget = selectedDayActivities.reduce((sum, activity) => sum + Number(activity.cost || 0), 0);
    const spentBudget = selectedDayActivities.reduce(
      (sum, activity) => sum + (activity.is_completed ? Number(activity.cost || 0) : 0),
      0
    );
    const progress = activityCount ? Math.round((completedCount / activityCount) * 100) : 0;
    return {
      dayCount,
      activityCount,
      completedCount,
      plannedBudget,
      spentBudget,
      progress
    };
  }, [days.length, selectedDayActivities]);

  const activeDayLabel = selectedDay ? `Dia ${selectedDay.day_number} • ${selectedDayActivities.length} atividades` : "Selecione um dia";
  const tripRange = formatDateRange(trip.start_date, trip.end_date);

  const shareTrip = async () => {
    const payload = {
      title: trip.title,
      text: `${trip.title} • ${trip.destination} • ${tripRange}`
    };

    try {
      if (navigator.share) {
        await navigator.share(payload);
        setToast("Roteiro compartilhado");
        return;
      }
      await navigator.clipboard.writeText(`${payload.title}\n${payload.text}`);
      setToast("Link copiado para a área de transferência");
    } catch {
      setToast("Não foi possível compartilhar agora");
    }
  };

  const openMapMode = () => {
    setViewMode((current) => (current === "timeline" ? "map" : "timeline"));
    setToast(viewMode === "timeline" ? "Modo mapa ativado" : "Linha do tempo ativada");
  };

  const toggleCompleted = (activityId) => {
    setData((current) => {
      if (!current) return current;
      return {
        ...current,
        activities: current.activities.map((activity) =>
          activity.id === activityId ? { ...activity, is_completed: !activity.is_completed } : activity
        )
      };
    });
  };

  const actionButtons = [
    { label: "Compartilhar", icon: Share2, onClick: shareTrip },
    { label: "Editar", icon: Pencil, onClick: () => setToast("Abrir fluxo de edição") },
    { label: viewMode === "timeline" ? "Modo Mapa" : "Modo Linha", icon: Globe2, onClick: openMapMode }
  ];

  return h(
    "div",
    { className: "min-h-screen bg-slate-50 text-slate-900" },
    h("div", { className: "safe-shell flex min-h-screen w-full flex-col px-3 pb-5 pt-3 sm:px-5 sm:pb-8 sm:pt-4 lg:px-8" },
      h(HeaderBar, { trip, tripRange, actionButtons, days, totals, loading, loadSource }),
      h("main", { className: "mt-4 grid w-full min-w-0 flex-1 gap-4 lg:mt-5 lg:grid-cols-[minmax(0,1fr)_352px] lg:gap-6" },
        h("section", { className: "w-full min-w-0 space-y-6" },
          h(TripHero, { trip, tripRange, days, loading }),
          h(DayTabs, { days, selectedDayId, setSelectedDayId, activeDayLabel, loading }),
          h(AnimatePresence, { mode: "wait", initial: false },
            viewMode === "timeline"
              ? h(motion.div, {
                  key: "timeline",
                  layout: true,
                  initial: { opacity: 0, y: 16, scale: 0.99 },
                  animate: { opacity: 1, y: 0, scale: 1 },
                  exit: { opacity: 0, y: -12, scale: 0.99 },
                  transition: PANEL_TRANSITION
                }, h(ActivityTimeline, {
                  day: selectedDay,
                  activities: selectedDayActivities,
                  loading,
                  onToggleCompleted: toggleCompleted
                }))
              : h(motion.div, {
                  key: "map",
                  layout: true,
                  initial: { opacity: 0, y: 16, scale: 0.99 },
                  animate: { opacity: 1, y: 0, scale: 1 },
                  exit: { opacity: 0, y: -12, scale: 0.99 },
                  transition: PANEL_TRANSITION
                }, h(MapModePanel, {
                  day: selectedDay,
                  activities: selectedDayActivities,
                  onBack: () => setViewMode("timeline")
                }))
          )
        ),
        h("aside", { className: "hidden w-full min-w-0 space-y-4 sm:block lg:sticky lg:top-4 lg:self-start" },
          h(ProgressWidget, { totals, loading }),
        )
      ),
      h(ToastBar, { toast })
    )
  );
}

  const syncLabel =
    loading && loadSource === "loading"
      ? "Sincronizando"

    "div",
    { className: "flex w-full flex-col gap-3 overflow-hidden rounded-3xl border border-white/60 bg-white/75 px-3 py-3 shadow-soft backdrop-blur-md sm:px-5 lg:flex-row lg:items-center lg:justify-between" },
    h("div", { className: "min-w-0" },
      h("p", { className: "text-[10px] font-semibold uppercase tracking-[0.32em] text-emerald-700/70" }, "Itinerary View"),
      h("div", { className: "mt-1 flex items-center gap-2" },
        h("h1", { className: "truncate text-base font-semibold text-slate-900 sm:text-lg" }, trip.title),
        h(StatusPill, { loadSource, loading, syncLabel })
      ),
      h("p", { className: "mt-0.5 text-xs text-slate-500" }, `${trip.destination} • ${tripRange}`)
    ),
    h("div", { className: "flex w-full flex-wrap items-center gap-2 lg:hidden" },
      h(MiniStat, { label: "Dias", value: days.length || "—", compact: true }),
      h(MiniStat, { label: "Concluído", value: `${totals.progress || 0}%`, compact: true }),
      ...actionButtons.map((action) =>
        h(ActionButton, { key: action.label, label: action.label, icon: action.icon, onClick: action.onClick, compact: true })
      )
    ),
    h("div", { className: "hidden flex-wrap items-center gap-2 lg:flex" },
      h(MiniStat, { label: "Dias", value: days.length || "—" }),
      h(MiniStat, { label: "Concluído", value: `${totals.progress || 0}%` }),
      ...actionButtons.map((action) =>
        h(ActionButton, { key: action.label, label: action.label, icon: action.icon, onClick: action.onClick })
      )
    )
  );
}

}

}

    h(Icon, { className: compact ? "h-4 w-4" : "h-4 w-4" }),

}

const parseCoordinate = (value) => {
  const number = typeof value === "string" ? Number.parseFloat(value) : Number(value);
  return Number.isFinite(number) ? number : null;
};

function buildRouteStops(activities) {
  const total = activities.length;
  if (!total) return [];
  const coords = activities
    .map((activity, index) => ({
      activity,
      index,
      latitude: parseCoordinate(activity.latitude),
      longitude: parseCoordinate(activity.longitude)
    }))
    .filter((item) => item.latitude !== null && item.longitude !== null);

  if (coords.length >= 2) {
    const latitudes = coords.map((item) => item.latitude);
    const longitudes = coords.map((item) => item.longitude);
    const minLat = Math.min(...latitudes);
    const maxLat = Math.max(...latitudes);
    const minLng = Math.min(...longitudes);
    const maxLng = Math.max(...longitudes);
    const latRange = Math.max(maxLat - minLat, 0.0001);
    const lngRange = Math.max(maxLng - minLng, 0.0001);

    return activities.map((activity, index) => {
      const latitude = parseCoordinate(activity.latitude);
      const longitude = parseCoordinate(activity.longitude);

      if (latitude !== null && longitude !== null) {
        const x = 16 + ((longitude - minLng) / lngRange) * 68;
        const y = 20 + (1 - (latitude - minLat) / latRange) * 56;
        return {
          ...activity,
          x: Math.max(12, Math.min(88, x)),
          y: Math.max(14, Math.min(86, y))
        };
      }

      const progress = total === 1 ? 0.5 : index / (total - 1);
      const x = 16 + 68 * progress;
      const wave = Math.sin(progress * Math.PI * 2.25);
      const y = 24 + wave * 12 + progress * 28;
      return {
        ...activity,
        x: Math.max(12, Math.min(88, x)),
        y: Math.max(14, Math.min(86, y))
      };
    });
  }

  const xStart = 16;
  const xEnd = 84;
  const yBase = 24;
  const yAmplitude = 12;
  const yDrift = 28;

  return activities.map((activity, index) => {
    const progress = total === 1 ? 0.5 : index / (total - 1);
    const x = xStart + (xEnd - xStart) * progress;
    const wave = Math.sin(progress * Math.PI * 2.25);
    const y = yBase + wave * yAmplitude + progress * yDrift;
    return {
      ...activity,
      x: Math.max(12, Math.min(88, x)),
      y: Math.max(14, Math.min(86, y))
    };
  });
}

function buildSmoothRoutePath(stops) {
  if (!stops.length) return "";
  if (stops.length === 1) {
    const [point] = stops;
    return `M ${point.x} ${point.y}`;
  }

  const points = stops.map((stop) => [stop.x, stop.y]);
  let path = `M ${points[0][0]} ${points[0][1]}`;

  for (let index = 0; index < points.length - 1; index += 1) {
    const p0 = points[index - 1] || points[index];
    const p1 = points[index];
    const p2 = points[index + 1];
    const p3 = points[index + 2] || p2;

    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;

    path += ` C ${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`;
  }
  return path;
}

          initial: { opacity: 0, y: 12 },
          animate: { opacity: 1, y: 0 },
          exit: { opacity: 0, y: 12 },
          transition: { duration: 0.2 },
          className: "fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-lg"
        }, toast)
      : null
  );
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
