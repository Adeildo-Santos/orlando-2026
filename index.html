<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f1a" id="meta-theme" />
  <title>Orlando 2026 — Roteiro</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0; width: 100%; min-height: 100dvh;
      overflow: hidden; overscroll-behavior: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100dvh; display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
      background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 40%, #16213e 100%);
      color: #fff;
    }
    #root { width: 100%; flex: 1; display: flex; flex-direction: column; }
    .scroll-content { flex: 1; overflow-y: auto; padding: 0 16px 100px; max-width: 600px; margin: 0 auto; width: 100%; }
    .scroll-content::-webkit-scrollbar { display: none; }
    .header-area, .tabs-area { width: 100%; max-width: 600px; margin: 0 auto; padding: 0 16px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    .loading { animation: pulse 1.2s ease-in-out infinite; }
    .card-anim { animation: slideUp 0.3s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const SUPABASE_URL = "https://dvgpvcqibhrkzsinncyf.supabase.co";

const { useState, useEffect, useCallback, useMemo } = React;
const { createRoot } = ReactDOM;

// Tipos com ícones
const TIPO_ICONE = {
  "Restaurantes": "🍽️",
  "Eletronicos": "💻",
  "Departamentos": "🛍️",
  "Praia": "🏖️",
  "Outlets": "🛍️",
  "Hotel": "🏨",
  "Mercado": "🛒",
  "Parques": "🎢"
};

function fmtData(d) {
  if (!d) return "";
  const [ano, mes, dia] = d.split("-");
  return `${dia}/${mes}`;
}

function diaSemana(d) {
  if (!d) return "";
  const dias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  return dias[new Date(d + "T12:00:00").getDay()];
}

function App() {
  const [registros, setRegistros] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(null);
  const [tipoFiltro, setTipoFiltro] = useState("todos");

  useEffect(() => {
    fetch(`${SUPABASE_URL}/rest/v1/trip?select=*&order=data.asc`, {
      headers: {
        "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Z3B2Y3FpYmhya3pzaW5uY3lmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODI1NDk0MywiZXhwIjoyMDkzODMwOTQzfQ.Rkh4KIx96Go_Nfk7YHkacV5nfjKvdDgHsLHwz_iyaPE",
        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Z3B2Y3FpYmhya3pzaW5uY3lmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODI1NDk0MywiZXhwIjoyMDkzODMwOTQzfQ.Rkh4KIx96Go_Nfk7YHkacV5nfjKvdDgHsLHwz_iyaPE"
      }
    })
    .then(r => { if (!r.ok) throw new Error("Erro ao carregar"); return r.json(); })
    .then(data => {
      setRegistros(data);
      setCarregando(false);
    })
    .catch(e => {
      setErro(e.message);
      setCarregando(false);
    });
  }, []);

  // Agrupar por data
  const grouped = useMemo(() => {
    const grupos = {};
    registros.forEach(r => {
      const chave = r.data || "sem-data";
      if (!grupos[chave]) grupos[chave] = [];
      grupos[chave].push(r);
    });
    return Object.entries(grupos).sort(([a], [b]) => a.localeCompare(b));
  }, [registros]);

  const tiposDisponiveis = useMemo(() => {
    const tipos = new Set(registros.map(r => r.tipo));
    return ["todos", ...tipos].filter(Boolean);
  }, [registros]);

  const filtered = useMemo(() => {
    if (tipoFiltro === "todos") return grouped;
    return grouped.map(([data, itens]) => [data, itens.filter(i => i.tipo === tipoFiltro)])
      .filter(([_, itens]) => itens.length > 0);
  }, [grouped, tipoFiltro]);

  const totalLocais = registros.length;
  const totalTipos = new Set(registros.map(r => r.tipo)).size;
  const totalDias = grouped.length;

  return React.createElement("div", { style: { height: "100dvh", display: "flex", flexDirection: "column", overflow: "hidden" } },
    // Header
    React.createElement("div", { className: "header-area", style: { paddingTop: "calc(20px + env(safe-area-inset-top, 0px))", paddingBottom: "12px", textAlign: "center" } },
      React.createElement("h1", { style: { fontSize: 22, fontWeight: 800 } }, "🏰 Orlando 2026"),
      React.createElement("p", { style: { fontSize: 12, color: "rgba(255,255,255,0.4)", marginTop: 2 } }, "15 a 22 de dezembro"),
      React.createElement("div", { style: { display: "flex", justifyContent: "center", gap: 16, marginTop: 10 } },
        React.createElement("div", { style: { textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: "#FFD700" } }, totalLocais),
          React.createElement("div", { style: { fontSize: 9, color: "rgba(255,255,255,0.4)", fontWeight: 600 } }, "PARADAS")
        ),
        React.createElement("div", { style: { textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: "#4ECDC4" } }, totalDias),
          React.createElement("div", { style: { fontSize: 9, color: "rgba(255,255,255,0.4)", fontWeight: 600 } }, "DIAS")
        ),
        React.createElement("div", { style: { textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: "#FF6B6B" } }, totalTipos),
          React.createElement("div", { style: { fontSize: 9, color: "rgba(255,255,255,0.4)", fontWeight: 600 } }, "TIPOS")
        ),
      )
    ),

    // Filtro tipos
    React.createElement("div", { className: "tabs-area", style: { paddingBottom: 12 } },
      React.createElement("div", { style: { display: "flex", gap: 6, overflowX: "auto", flexShrink: 0 } },
        tiposDisponiveis.map(t =>
          React.createElement("button", {
            key: t,
            onClick: () => setTipoFiltro(t),
            style: {
              border: `1px solid ${tipoFiltro === t ? "#FFD700" : "rgba(255,255,255,0.1)"}`,
              background: tipoFiltro === t ? "rgba(255,215,0,0.12)" : "rgba(255,255,255,0.04)",
              borderRadius: 99,
              padding: "5px 12px",
              fontSize: 11,
              fontWeight: 600,
              color: tipoFiltro === t ? "#FFD700" : "rgba(255,255,255,0.5)",
              cursor: "pointer",
              whiteSpace: "nowrap",
              fontFamily: "inherit",
              outline: "none",
              transition: "all 0.2s"
            }
          }, t === "todos" ? "📍 Todos" : `${TIPO_ICONE[t] || "📍"} ${t}`)
        )
      )
    ),

    // Conteúdo
    React.createElement("div", { className: "scroll-content", style: { paddingBottom: 100 } },
      carregando && React.createElement("div", { style: { textAlign: "center", padding: 40, color: "rgba(255,255,255,0.3)", fontSize: 13 } }, "Carregando roteiro..."),
      erro && React.createElement("div", { style: { textAlign: "center", padding: 40, color: "#FF6B6B", fontSize: 13 } }, `❌ ${erro}`),

      !carregando && !erro && filtered.map(([data, itens], idx) =>
        React.createElement("div", {
          key: data,
          className: "card-anim",
          style: { animationDelay: `${idx * 0.05}s` }
        },
          // Cabeçalho do dia
          React.createElement("div", {
            style: {
              display: "flex", alignItems: "center", gap: 8,
              padding: "14px 0 8px", marginTop: idx === 0 ? 0 : 4,
              borderBottom: "1px solid rgba(255,255,255,0.06)"
            }
          },
            React.createElement("div", {
              style: {
                width: 36, height: 36, borderRadius: 10,
                background: "rgba(255,215,0,0.12)",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 16, fontWeight: 800, color: "#FFD700", flexShrink: 0
              }
            }, fmtData(data)),
            React.createElement("div", { style: { flex: 1 } },
              React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.3)", fontWeight: 600 } }, diaSemana(data)),
              React.createElement("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.15)" } }, `${itens.length} ${itens.length === 1 ? "parada" : "paradas"}`)
            )
          ),
          // Itens do dia
          itens.map(item =>
            React.createElement("div", {
              key: item.id,
              style: {
                display: "flex", alignItems: "center", gap: 10,
                padding: "10px 0",
                borderBottom: "1px solid rgba(255,255,255,0.03)"
              }
            },
              React.createElement("div", {
                style: {
                  width: 32, height: 32, borderRadius: 8,
                  background: "rgba(255,255,255,0.04)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 14, flexShrink: 0
                }
              }, TIPO_ICONE[item.tipo] || "📍"),
              React.createElement("div", { style: { flex: 1, minWidth: 0 } },
                React.createElement("div", { style: { fontSize: 13, fontWeight: 600 } }, item.objetivo),
                React.createElement("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.3)", marginTop: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, item.tipo)
              ),
              item.endereco && React.createElement("a", {
                href: `https://maps.google.com/maps?q=${encodeURIComponent(item.endereco)}`,
                target: "_blank",
                style: {
                  fontSize: 16, textDecoration: "none", opacity: 0.4,
                  transition: "opacity 0.2s", flexShrink: 0
                },
                title: item.endereco
              }, "🗺️")
            )
          )
        )
      ),

      !carregando && !erro && filtered.length === 0 &&
        React.createElement("div", { style: { textAlign: "center", padding: 40, color: "rgba(255,255,255,0.3)", fontSize: 13 } },
          "Nenhum local encontrado para este filtro"
        )
    )
  );
}

const root = createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
